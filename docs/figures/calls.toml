# The call edges of the harness: one [[call]] entry for each spawn of an agent by an agent or a
# skill. docs/.vitepress/calls.mjs draws the figures of docs/src/agents-at-work.md from this file,
# and `harness test` checks it (lib/harness/docs.py).
#
#   caller  the agent or skill that spawns
#   callee  the agent it spawns
#   at      the file:line, in the caller's source, of the instruction that spawns; the line names
#           the callee
#   effort  only where the caller sets an effort other than the callee's own
#   label   the text on the edge: when or why the caller spawns
#
# The model and the effort of each node come from its source's frontmatter and from
# examples/models.toml, never from this file. A caller that spawns one callee at two efforts has
# two entries.

[[call]]
caller = "build-part"
callee = "julia-builder"
at = "skills/build-part/SKILL.md:118"
label = "build, fix, finish"

