# The tools of `harness setup` (lib/harness/setup.py) that have a minimum version or a pinned
# release.
#
# [minimum] holds the minimum of each tool that has one, under its name in
# docs/src/dependencies.md: the versions of its `≥` cell, in order. A version meets them at or
# above the last one, or at or above an earlier one of the same major release, as Node.js 20.16 in
# 20.x. A tool with no minimum is met by any version. A case of `harness test setup` holds each list
# equal to the page.
#
# [release.<tool>] is a release that `harness setup` installs on Ubuntu into ~/.local/bin, where no
# apt candidate meets the tool's minimum: `version`, and per system and architecture a table with
# the `url` of a .tar.gz archive that holds the program at its top level, and the `sha256` of that
# archive. A download whose sha256 differs installs nothing. Each sha256 is the one that the
# project publishes in its checksum file of the release.

[minimum]
gitleaks = ["8.21"]
"Node.js" = ["20.16", "22.3"]
actionlint = ["1.7.12"]
Julia = ["1.13"]
fatou = ["0.22.0"]

[release.gitleaks]
version = "8.30.1"

[release.gitleaks.linux-x86_64]
url = "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
sha256 = "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

[release.gitleaks.linux-aarch64]
url = "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_arm64.tar.gz"
sha256 = "e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080"

[release.actionlint]
version = "1.7.12"

