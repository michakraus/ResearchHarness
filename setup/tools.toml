# The tools of `harness setup` (lib/harness/setup.py) that have a minimum version or a pinned
# release.
#
# [minimum] holds the minimum of each tool that has one, under its name in
# docs/src/dependencies.md: the versions of its `≥` cell, in order. A version meets them at or
# above the last one, or at or above an earlier one of the same major release. A tool with no
# minimum is met by any version. A case of `harness test setup` holds each list equal to the page.
#
# [release.<tool>] is a release that `harness setup` installs on Ubuntu into ~/.local/bin, where no
# apt candidate meets the tool's minimum: `version`, and per system and architecture a table with
# the `url` of a .tar.gz archive that holds the program at its top level, and the `sha256` of that
# archive. A download whose sha256 differs installs nothing. Each sha256 is the one that the
# project publishes in its checksum file of the release.
#
# The release of a tool of TREES in lib/harness/setup.py, Node.js, is a whole tree instead: the url
# of a .tar.xz with one top-level directory, which `harness setup` unpacks whole into
# ~/.local/share/research-harness/<command>/<version>/ and whose bin/ programs it links into
# ~/.local/bin.

[minimum]
gitleaks = ["8.21"]
"Node.js" = ["22.12"]
actionlint = ["1.7.12"]
Julia = ["1.13"]
fatou = ["0.22.0"]

[release."Node.js"]
version = "24.22.2"

# The sha256s of https://nodejs.org/dist/v24.22.2/SHASUMS256.txt.
[release."Node.js".linux-x86_64]
url = "https://nodejs.org/dist/v24.22.2/node-v24.22.2-linux-x64.tar.xz"
sha256 = "48cc0e21e048790e54c0cf5749c2725005313d652651c40b7a21feb9697aaf75"

[release."Node.js".linux-aarch64]
url = "https://nodejs.org/dist/v24.22.2/node-v24.22.2-linux-arm64.tar.xz"
