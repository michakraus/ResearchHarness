# What the srt settings of each CLI frontend add to the `sandbox` section of the Claude Code
# settings template (settings/settings.proposal.json). The template stays the source of the
# shared lists; `harness install` renders one file per chosen frontend from both
# (lib/harness/sandbox.py, docs/src/components/sandbox.md). Every path starts with `~/`.

# The read limit: srt denies reads of the whole home directory and allows these paths again. A
# path that the template's `denyRead` or `credentials.files` names stays hidden inside them, as a
# deny inside an allowed path wins in srt, unless a frontend's `own` below names it, or its
# `read_files` names a file inside it.
[read]
allow = [
    "~/Research",
    "~/.local",
    "~/.cache",
    "~/.config",
    "~/.gitconfig",
    "~/.zshenv",
    "~/.zshrc",
    "~/.zprofile",
    "~/.julia",
    "~/.juliaup",
    "~/Library/Caches",
    "~/Library/Application Support/rtk",
]

# Per frontend:
#   state       the frontend's own directories and files, which it reads and writes; no other
#               frontend's file allows a write at or below them, and its own file leaves out each
#               literal write deny of the template, other than the home directory, strictly above
#               one. The last one is a path that the template's `allowWrite` lacks, so that
#               `allowWrite` ends with it where no temporary directory follows
#   deny_write  write denies after the template's
#   own         the template's deny entries that the frontend itself reads and writes, its own
#               credential files by name; its file leaves them out of `denyWrite` and `denyRead`
#               and adds them to `allowRead`. An entry can also be a file that the frontend reads
#               only, such as Kaimon's token, which a write deny above it keeps read-only
#   read_files  files below a read deny directory that the frontend reads and does not write; its
#               file adds them to `allowRead` and writes the directory as the glob `<directory>/*`,
#               which a file allow pierces in srt
#   network     hosts that the frontend itself reaches, added to its file's `allowedDomains` after
#               the template's, each once; an entry is `host` or `host:port`, `host` being
#               `localhost`, a name of two or more labels or `*.` before one. The overlay
#               `network.toml` beside the profile adds the user's hosts in a `[frontend.<name>]`
#               table, and a deny entry without a port of the network lists removes an entry
#   mach_lookup macOS services, by their exact name, that the frontend itself looks up over XPC
#               or Mach; its file lists them in `network.allowMachLookup`, which srt adds to the
#               services that its profile allows, and has no such key where the list is empty. A
#               name holds no `*`: srt would read a trailing one as a prefix of names

[frontend.claude]
state = [
    "~/.claude",
    "~/.cache/claude",
    "~/.claude.json",
    "~/.config/anthropic/credentials",
    "~/.config/anthropic/credentials.lock",
]
deny_write = []
own = ["~/.claude.json", "~/.claude/.credentials.json", "~/.config/anthropic/credentials"]
read_files = []
# Claude Code refreshes its sign-in token here (`/v1/oauth/token`).
network = ["platform.claude.com"]
mach_lookup = []

[frontend.opencode]
state = ["~/.local/share/opencode", "~/.local/state/opencode", "~/.cache/opencode"]
deny_write = []
own = [
    "~/.local/share/opencode/auth.json",
    "~/.local/share/opencode/mcp-auth.json",
    "~/.config/kaimon/auth-token",
]
read_files = [
    "~/.config/api-keys/gwdg-token",
    "~/.config/api-keys/opendesign-token",
    "~/.config/api-keys/tokenharbor-token",
]
network = []
mach_lookup = []

[frontend.omp]
state = ["~/.omp"]
deny_write = ["~/.omp/agent/config.yml", "~/.omp/agent/extensions"]
own = [
    "~/.omp/agent/agent.db",
    "~/.omp/agent/agent.db-wal",
    "~/.omp/agent/.env",
    "~/.config/kaimon/auth-token",
]
read_files = []
network = []
# oh-my-pi's typo detection (`spelling.typoDetection`) asks the macOS spell service for each typed
# word; with the language set to "automatic by language", the service is this one.
mach_lookup = ["mul-xpc (Apple)_OpenStep"]

[frontend.antigravity]
state = ["~/.gemini"]
deny_write = []
own = ["~/.gemini/jetski-standalone-oauth-token"]
read_files = []
# agy refreshes its login token at the first host, checks its eligibility and calls its model at the
# second, and reads the account at the third.
network = ["oauth2.googleapis.com", "daily-cloudcode-pa.googleapis.com", "www.googleapis.com"]
# agy is a Go program, and Go checks a TLS certificate through this service on macOS; srt allows it
# otherwise only with `enableWeakerNetworkIsolation`, which would open it to every frontend.
mach_lookup = ["com.apple.trustd.agent"]
