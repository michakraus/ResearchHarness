# What the srt settings of each CLI frontend add to the `sandbox` section of the Claude Code
# settings template (settings/settings.proposal.json). The template stays the source of the
# shared lists; `harness install` renders one file per chosen frontend from both
# (lib/harness/sandbox.py, docs/src/components/sandbox.md). Every path starts with `~/`.

# The read limit: srt denies reads of the whole home directory and allows these paths again. A
# path that the template's `denyRead` or `credentials.files` names stays hidden inside them, as a
# deny inside an allowed path wins in srt, unless a frontend's `own` below names it, or its
# `read_files` names a file inside it.
[read]
allow = [
    "~/Research",
    "~/.local",
    "~/.cache",
    "~/.config",
    "~/.gitconfig",
    "~/.zshenv",
    "~/.zshrc",
    "~/.zprofile",
    "~/.julia",
    "~/.juliaup",
    "~/Library/Caches",
    "~/Library/Application Support/rtk",
]

# Per frontend:
#   state       the frontend's own directories and files, which it reads and writes; no other
#               frontend's file allows a write at or below them, and its own file leaves out each
#               literal write deny of the template, other than the home directory, strictly above
#               one. The last one is a path that the template's `allowWrite` lacks, so that
#               `allowWrite` ends with it where no temporary directory follows
#   deny_write  write denies after the template's
#   own         the template's deny entries that the frontend itself reads and writes, its own
#               credential files by name; its file leaves them out of `denyWrite` and `denyRead`
#               and adds them to `allowRead`
#   read_files  files below a read deny directory that the frontend reads and does not write; its
#               file adds them to `allowRead` and writes the directory as the glob `<directory>/*`,
#               which a file allow pierces in srt

[frontend.claude]
state = [
    "~/.claude",
    "~/.cache/claude",
    "~/.claude.json",
    "~/.config/anthropic/credentials",
    "~/.config/anthropic/credentials.lock",
]
deny_write = []
own = ["~/.claude.json", "~/.claude/.credentials.json", "~/.config/anthropic/credentials"]
read_files = []

[frontend.opencode]
state = ["~/.local/share/opencode", "~/.local/state/opencode", "~/.cache/opencode"]
deny_write = []
own = ["~/.local/share/opencode/auth.json", "~/.local/share/opencode/mcp-auth.json"]
read_files = [
    "~/.config/api-keys/gwdg-token",
    "~/.config/api-keys/opendesign-token",
    "~/.config/api-keys/tokenharbor-token",
]

[frontend.omp]
state = ["~/.omp"]
deny_write = ["~/.omp/agent/config.yml", "~/.omp/agent/extensions"]
own = ["~/.omp/agent/agent.db", "~/.omp/agent/agent.db-wal", "~/.omp/agent/.env"]
read_files = []

[frontend.antigravity]
state = ["~/.gemini"]
deny_write = []
own = ["~/.gemini/jetski-standalone-oauth-token"]
read_files = []
