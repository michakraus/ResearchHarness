# The file rules of the two launch agents that run Julia outside every session: the Kaimon server
# and the julia-update job. `harness render sandbox/<job>.sb` turns the rules of one job into the
# Seatbelt profile that its plist starts the program under, `/usr/bin/sandbox-exec -f <profile>`;
# lib/harness/jobsandbox.py documents the render.
#
# The profile denies every file read and write, then allows what the lists below name; every other
# class of operation stays allowed, the network and the Mach and IOKit services of Metal too. Then
# it denies the writes of `deny_write`, the repository parts .git/hooks, .git/config and .githooks
# at any depth below ~/Research; then it allows the writes of `allow_write_files`; then it denies
# the operations of `deny_operations` and the Mach services of `deny_services`.
#
# A path is one of the tokens $DARWIN_USER_TEMP_DIR, $DARWIN_USER_CACHE_DIR (the values of
# `getconf` of the same name) and $HARNESS (the profile's `harness`) alone, or `~`, nothing or a
# token, then `/` and segments, none of them empty, `.` or `..`; in `read_files` it can also be the
# root `/` alone. A system path is in its real form, `/private/etc` and not `/etc`, because
# Seatbelt matches the path after it resolves a symlink. `read` and `write` are directories with
# everything below them, and `read_files`, `write_files` and `allow_write_files` single files.
#
# `pty`, true or false, says whether the job uses pseudo-terminals. With true, the profile allows
# the operation `pseudo-tty` and reads, writes and ioctls of /dev/ptmx and of every /dev/ttysNNN,
# after the write allows and before the write denies; the renderer holds both paths, and the rule
# list names no device. Seatbelt cannot tell a pseudo-terminal of the job from the terminal window
# of another program of the same user, so such a job can read from and write to every terminal of
# the user.

# The escapes of a confined process: opening an app or a document through Launch Services, an
# Apple Event to another app, and a mount.
deny_operations = ["lsopen", "appleevent-send", "file-mount", "file-unmount"]
deny_services = ["com.apple.coreservices.launchservicesd", "com.apple.CoreServices.coreservicesd"]

# The Kaimon server and every session it runs for an agent: the research tree, the Julia depot and
# juliaup, its own configuration, cache and logs, git's configuration, and the system. Pkg unpacks
# in /private/tmp, and /etc/localtime resolves below /private/var/db/timezone.
[job.kaimon]
read = [
    "~/Research",
    "~/.julia",
    "~/.juliaup",
    "~/.config/kaimon",
    "~/.cache/kaimon",
    "~/Library/Logs/kaimon",
    "~/.config/git",
    "$DARWIN_USER_TEMP_DIR",
    "$DARWIN_USER_CACHE_DIR",
    "/System",
    "/usr",
    "/bin",
    "/sbin",
    "/Library",
    "/private/etc",
    "/private/tmp",
    "/private/var/db/timezone",
    "/dev",
    "/opt/homebrew",
]
# The root directory `/` itself, not what is below it: dyld reads it when a process starts, and
# without it every process of the job aborts at start-up.
read_files = ["/", "~/.gitconfig"]
# ~/.config/kaimon: Kaimon writes its projects.json there. The cache token holds Metal's shader
# cache.
write = [
    "~/Research",
    "~/.julia",
    "~/.cache/kaimon",
    "~/Library/Logs/kaimon",
    "~/.config/kaimon",
    "$DARWIN_USER_TEMP_DIR",
    "$DARWIN_USER_CACHE_DIR",
    "/private/tmp",
]
write_files = ["/dev/null", "/dev/tty", "/dev/dtracehelper"]
# The programs and the startup code of the depot, juliaup's own state, and the source that the
# hooks of every repository are installed from.
deny_write = ["~/.julia/bin", "~/.julia/config", "~/.julia/juliaup", "$HARNESS/githooks"]
# Single files inside a write deny that the job writes all the same: the profile allows them after
# the write denies. The juliaup launcher, which starts the server and every Julia of its sessions,
# opens its lock file for writing at every start and exits when that fails; juliaup.json and the
# installed Julia versions stay unwritable.
allow_write_files = ["~/.julia/juliaup/.juliaup-lock"]
# Kaimon starts every Julia session on a pseudo-terminal, with forkpty(3).
pty = true

# The daily update: juliaup's releases and juliaup.json, the default environments, the Kaimon app
# and its shim in ~/.julia/bin, and the harness's Julia environment. It reads the profile for
# `launchd_prefix`, and runs its installed copy in ~/.local/bin.
[job.julia-update]
read = [
    "~/.julia",
    "~/.juliaup",
    "~/.local/share/research-harness/julia",
    "~/.config/git",
    "$DARWIN_USER_TEMP_DIR",
    "$DARWIN_USER_CACHE_DIR",
    "/System",
    "/usr",
    "/bin",
    "/sbin",
    "/Library",
    "/private/etc",
    "/private/tmp",
    "/private/var/db/timezone",
    "/dev",
    "/opt/homebrew",
]
# The root directory `/` itself, as for kaimon.
read_files = [
    "/",
    "~/.gitconfig",
    "~/.config/research-harness/profile.toml",
    "~/.local/bin/julia-update.jl",
]
write = [
    "~/.julia",
    "~/.juliaup",
    "~/.julia/juliaup",
    "~/.julia/bin",
    "~/.julia/environments/apps",
    "~/.local/share/research-harness/julia",
    "$DARWIN_USER_TEMP_DIR",
    "$DARWIN_USER_CACHE_DIR",
    "/private/tmp",
]
write_files = ["/dev/null", "/dev/tty", "/dev/dtracehelper"]
deny_write = ["~/.julia/config", "$HARNESS/githooks"]
allow_write_files = []
pty = false
