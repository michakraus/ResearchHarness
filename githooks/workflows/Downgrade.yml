# Canonical downgrade workflow of the ResearchHarness. `harness workflows --apply` copies it
# verbatim into every package and experiment repository, beside CI.yml. Edit the template,
# githooks/workflows/Downgrade.yml, and re-run the installer; never edit an installed copy.
# verify-workflows.jl asserts that every copy is byte-identical to it.
#
# WHEN IT RUNS.
#
# The downgrade job tests the `[compat]` lower bounds, which change only with a Project.toml. So it
# runs on a pull request and a push to `main` or `master` that change `Project.toml` or
# `test/Project.toml`, the two projects that it resolves; on every tag, for which GitHub reads no
# path filter; weekly, with the whole matrix of CI.yml; and by hand.
#
# It is advisory: it is red wherever a floor is false, and its path filter leaves most pull
# requests without its checks, so harness ci-protection requires none of them.
#
# Its `groups` job is the one of CI.yml, so that both workflows read test/ci-groups.toml with one
# script, and the downgrade job runs one job per test group, as the `test` job of CI.yml does.

name: Downgrade

on:
    push:
        branches:
            - main
            - master
        tags: ["*"]
        paths:
            - Project.toml
            - test/Project.toml
    pull_request:
        paths:
            - Project.toml
            - test/Project.toml
    workflow_dispatch:
    # Weekly, Monday 03:17 UTC, with CI.yml.
    schedule:
        - cron: "17 3 * * 1"

concurrency:
    # The group of CI.yml: one run per ref and event; a pull request cancels its older run.
    group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
    cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
    groups:
        # The test groups of test/ci-groups.toml as a JSON list, or `[""]` where the file is absent;
        # and the Julia versions of `test-other` for this event as a JSON list.
        name: Test groups
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
        outputs:
            list: ${{ steps.read.outputs.list }}
            versions: ${{ steps.read.outputs.versions }}
        steps:
            - uses: actions/checkout@v7
              with:
                  sparse-checkout: test/ci-groups.toml
                  sparse-checkout-cone-mode: false
                  persist-credentials: false
            - id: read
              shell: python
              run: |
                  import json, os, pathlib, re, tomllib
                  path = pathlib.Path("test/ci-groups.toml")
                  groups = tomllib.loads(path.read_text()).get("groups") if path.is_file() else [""]
                  if path.is_file() and not (
                      isinstance(groups, list) and groups
                      and all(isinstance(g, str) and re.fullmatch("[a-z][a-z0-9]*", g) for g in groups)
                      and len(set(groups)) == len(groups)
                  ):
                      raise SystemExit(f"{path}: `groups` is not a list of distinct group names: {groups!r}")
                  # `1` alone for a pull request and a push to a branch; `min` and `1` for a tag, the
                  # schedule, a run by hand and every other event, so a new trigger never runs less.
                  event, ref = os.environ["GITHUB_EVENT_NAME"], os.environ["GITHUB_REF"]
                  short = event == "pull_request" or (event == "push" and ref.startswith("refs/heads/"))
                  versions = ["1"] if short else ["min", "1"]
                  print("groups:", groups, "versions:", versions)
                  with open(os.environ["GITHUB_OUTPUT"], "a") as out:
                      out.write(f"list={json.dumps(groups)}\n")
                      out.write(f"versions={json.dumps(versions)}\n")

    downgrade:
        # The `[compat]` lower bounds. `min` tests the lowest Julia with the newest dependencies,
        # which leaves every dependency floor untested: a floor can name a version that cannot be
        # installed at all, or that conflicts with a sibling's floor, and nothing notices. This job
        # resolves every direct dependency of the root Project.toml and of test/Project.toml to
        # exactly its lower bound on the lowest Julia, and `forcedeps` fails, naming the entry, when
        # one cannot sit at its bound. Then it runs the suite there, so a floor that installs but
        # lacks something the package calls fails too.
        #
        # `projects: ., test` resolves the two projects together, into one manifest. A resolve of
        # the root alone takes each indirect dependency at its newest version, and the test run,
        # which keeps that manifest, then cannot add a test-only dependency that caps it: Documenter
        # 1.19 allows no DocStringExtensions 0.10, CairoMakie no FreeType that CEnum 1.0 allows.
        # The action stops when test/Project.toml is missing.
        #
        # The stdlibs are skipped because their version is fixed by the Julia version. The list is
        # every stdlib a repository here depends on, and the common rest; add one when a
        # repository takes a stdlib that is not on it.
        #
        # One job per test group, as the `test` job of CI.yml: the whole suite on the lowest Julia
        # takes as long as the longest entry of the matrix.
        name: Downgrade - ubuntu-latest${{ matrix.group && format(' - {0}', matrix.group) || '' }}
        needs: groups
        runs-on: ubuntu-latest
        timeout-minutes: 120
        # Advisory: see the header.
        continue-on-error: true
        permissions:
            actions: write
            contents: read
        env:
            JULIA_NUM_THREADS: 2
        strategy:
            fail-fast: false
            matrix:
                group: ${{ fromJSON(needs.groups.outputs.list) }}
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false
            - uses: julia-actions/setup-julia@v3
              with:
                  version: min
            - uses: julia-actions/cache@v3
            - uses: julia-actions/julia-downgrade-compat@v2
              with:
                  mode: forcedeps
                  julia_version: min
                  projects: ., test
                  skip: ArgTools,Artifacts,Base64,CRC32c,Dates,DelimitedFiles,Distributed,Downloads,FileWatching,Future,InteractiveUtils,LazyArtifacts,LibCURL,LibGit2,Libdl,LinearAlgebra,Logging,Markdown,Mmap,NetworkOptions,Pkg,Printf,Profile,REPL,Random,SHA,Serialization,SharedArrays,Sockets,SparseArrays,Statistics,TOML,Tar,Test,UUIDs,Unicode
            - uses: julia-actions/julia-buildpkg@v1
            - uses: julia-actions/julia-runtest@v1
              with:
                  # The same `auto` as the `test` job of CI.yml, and for the same reason: a
                  # kernel that a compiled backend runs cannot allocate.
                  check_bounds: auto
                  # Keep the resolved floors: a re-resolve would move them back up, and the
                  # Dependabot default would force the newest version of the bumped entry.
                  allow_reresolve: false
                  force_latest_compatible_version: false
                  test_args: ${{ matrix.group }}
