# The network lists of the Claude Code settings. `harness install`, `harness render` and
# `harness settings` generate them into the settings template; the template holds no host.
#
#   allow           a host that the WebFetch tool and a sandboxed command can reach:
#                   `WebFetch(domain:X)` in `permissions.allow`, and X in
#                   `sandbox.network.allowedDomains`, with `*.X` when X is its own registrable
#                   domain. Write the host, never `*.X`.
#   fetch           a host that only the WebFetch tool, which sends a GET, can reach:
#                   `WebFetch(domain:X)` in `permissions.allow`, after the rules of `allow`, and
#                   nothing in `allowedDomains`, so no sandboxed command reaches it. A host that
#                   accepts writes and is needed only for reading goes here. A frontend under
#                   `agentbox` does not reach it at all, because srt takes `allowedDomains` alone.
#                   Write the host, never `*.X`.
#   infrastructure  a host that only a sandboxed command can reach, in `allowedDomains` exactly as
#                   written; `*.X` is allowed.
#   deny            a host that neither can reach: `WebFetch(domain:X)` in `permissions.deny`, and X
#                   in `sandbox.network.deniedDomains`. `*`, `*.X` and `X:port` are allowed; an
#                   entry with a port is no WebFetch rule.
#   [deny_reasons]  the reason for a `deny` entry, keyed by the exact entry, which Claude Code shows
#                   the model when the sandbox refuses a connection.
#
# An overlay with the same keys, `network.toml` beside the profile, adds its entries. A `deny`
# entry of either file removes each `allow`, `fetch` and `infrastructure` host that it matches.
# Each entry is a host, not a URL. The sandbox refuses a host that no list names, with no prompt
# (`strictAllowlist`); a WebFetch of it matches no rule and asks in the default permission mode.

