# A process killed by a signal has exitcode 0 in Julia, so exitcode alone reads it as a success.
# The guard is searched in each enclosing definition (a function or a short-form f(…) = …), and in
# the whole file: a termsignal read in another function does not cover this one. A definition that
# holds the guard lies in a file that holds it, so the file decides only for a read at top level.
id: exitcode-alone
language: julia
severity: error
message: p.exitcode read without p.termsignal or success(p); a process killed by a signal has exitcode 0, so check termsignal too or call success(p)
utils:
  def:
    any:
      - kind: function_definition
      - kind: assignment
        has: { kind: call_expression, nthChild: 1 }
  guard:
    has:
      stopBy: end
      any:
        - { kind: identifier, regex: '^termsignal$' }
        - kind: call_expression
          has: { kind: identifier, regex: '^success$' }
rule:
  pattern: µP.exitcode
  any:
    - inside:
        stopBy: end
        matches: def
        not: { matches: guard }
    - inside:
        stopBy: end
        kind: source_file
        not: { matches: guard }
