id: allocated-equality
valid:
  - "@test @allocated(f(1)) == 0"
  - "@test @allocated(f(1)) <= @allocated(f(2))"
  - "@test (@allocated f(1)) == 0"
  - "@test (@allocated f(1)) <= (@allocated f(2))"
  - "@test @allocations(f(1)) == @allocations(f(2))"
  - "@test @allocated(f(1)) !== @allocated(f(2))"
  - "@test (@allocated f(1); 0) == (@allocated f(2))"
invalid:
  - "@test @allocated(f(1)) == @allocated(f(2))"
  - "x = @allocated(g()) === @allocated(h())"
  - "@test (@allocated f(1)) == (@allocated f(2))"
  - "x = (@allocated g()) === @allocated(h())"
