id: catch-variable-unused
valid:
  - "try\n    f()\ncatch e\n    e isa MethodError || rethrow()\n    nothing\nend"
  - "try\n    f()\ncatch E\n    showerror(stderr, E)\nend"
  - "try\n    f()\ncatch err\n    @warn \"failed\" exception = err\nend"
  - "try\n    f()\ncatch e\n    cleanup()\n    rethrow()\nend"
  - "try\n    f()\ncatch e\n    throw(DomainError(1.0, \"wrapped\"))\nend"
  - "x = try f() catch e; e end"
  - "try\n    f()\ncatch MethodError\n    nothing\nend"
  - "try\n    f()\ncatch ArgumentError\n    return false\nend"
  - "try\n    f()\ncatch InterruptException\n    nothing\nend"
  - "try\n    f()\ncatch Float64Error\n    nothing\nend"
  - "try\n    f()\ncatch e\nend"
  - "try\n    f()\ncatch\n    nothing\nend"
invalid:
  - "try\n    f()\ncatch e\n    nothing\nend"
  - "try\n    f()\ncatch E\n    nothing\nend"
  - "x = try f() catch err; 0.0 end"
  - "try\n    f()\ncatch e\n    @warn \"failed\"\n    return false\nend"
  - "try\n    f()\ncatch ErrorCount\n    g(x)\nend"
  - "try\n    f()\ncatch e\n    throw_away(x)\nend"
  - "try\n    f()\ncatch MethodErrorFlag\n    nothing\nend"
  - "try\n    f()\ncatch lastArgError\n    nothing\nend"
