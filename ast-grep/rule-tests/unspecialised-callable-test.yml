id: unspecialised-callable
valid:
  - "f(x, g::F) where {F <: Function} = h(g, x)"
  - "function f(g::F, x) where {F <: Base.Callable}\n    S(g)\nend"
  - "f(::Function, x) = x"
  - "struct S\n    g::Function\nend"
  - "x = y::Function"
  - "f(g::Union{Function, Nothing}) = S(g)"
  - "f(x, g::Function) = g(x)"
  - "f(x, g::Function) = g.(x)"
  - "f(g::Function, x::T) where {T} = g(x)"
  - "f(g::Function, x)::Int = g(x)"
  - "function f(g::Base.Callable, x)\n    g(x)\nend"
  - "function f(g::Base.Callable, x)\n    g.(x)\nend"
  - "function f(g::Function, x::T)::T where {T}\n    y = g(x)\n    S(g, y)\nend"
  - "f(x; g::Base.Function = identity) = map(v -> g(v), x)"
  - "function outer(g::Function)\n    inner(x) = S(x)\n    g(1)\nend"
  - "function outer(g::Function)\n    inner(x) = g(x)\n    S(inner)\nend"
invalid:
  - "f(x, g::Function) = h(g, x)"
  - "function f(g::Base.Callable, x)\n    S(g)\nend"
  - "function f(g::Function, x::T)::T where {T}\n    h(g, x)\nend"
  - "f(x; g::Function = identity) = h(g, x)"
  - "f(x, g::Callable = identity) = S(g)"
  - "f(x, g::Base.Function) = S(g)"
  - "function f(g::Function, x)\n    h(x)\nend"
  - "function outer(g::Function)\n    inner(g::Function) = S(g)\n    g(1)\nend"
