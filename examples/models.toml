# The model tables of a ResearchHarness installation: which model each harness runs for each
# agent. Copy this file to ~/.config/research-harness/models.toml, beside the profile, and fill it
# in. `harness install` finds it as `--models F`, else $RESEARCH_HARNESS_MODELS, else beside the
# profile that `--profile` or the default names. No template names these keys, and
# `harness render` does not read this file.
#
# An agent's `model:` names a tier, `large`, `medium` or `small`. Claude Code has its own table of
# the tiers, [claude]. OpenCode and oh-my-pi share every other table, so that their agents run on
# the same models; [opencode] and [omp] hold only where one of them differs. A table with a tier's
# old name, `opus`, `sonnet` or `haiku`, stops the install and names the rename.

# The Claude Code model of each tier, written as the `model:` of the installed agent or skill.
# All three tiers are required. A model is a letter, then letters, digits and . _ - [ ], so that
# YAML reads it as written. Claude Code reads none of the tables below.
[claude]
large = "opus"
medium = "sonnet"
small = "haiku"

# --- The tables of OpenCode and oh-my-pi ---------------------------------------------------------

# The model of each tier, as `provider/model`. oh-my-pi needs all three, and the `medium` model is
# also its default model, `modelRoles.default` in harness.yml, so that it picks no model by itself.
# Under OpenCode, an agent whose tier has no entry stops the install. An agent with no `model:`
# runs on its caller's model.
[models]
large = "provider-a/large-model"
medium = "provider-b/medium-model"
small = "provider-b/small-model"

# An agent whose model is not the one its tier maps to.
[model_overrides]
builder = "provider-b/medium-model"

# The effort of every agent on a model: OpenCode's `variant:`, oh-my-pi's `thinking-level`. A
# variant is provider-specific.
[model_variants]
"provider-a/large-model" = "medium"

# The effort of one agent or council seat, over its model's: OpenCode's `variant:`.
[variants]
judge = "high"

# The effort of one agent or council seat, for a model that has no variant for it: OpenCode's
# `reasoningEffort:`. oh-my-pi writes it as `thinking-level`, as it writes a variant.
[reasoning_effort]
critic-c = "high"

# Copies of an agent on other models, in order: each is written as `<name>.md`, with its own
# model and the agent's body. A council is keyed by an agent of agents/; any other key stops the
# install. One seat may add `verify = true`: it also judges each verify round, alone.
[councils]
julia-critic = [
    { name = "critic-b", model = "provider-c/other-model", verify = true },
    { name = "critic-c", model = "provider-b/medium-model" },
]

# The input tokens that a model may hold: OpenCode's `limit` in the `provider` object of
# opencode.jsonc, oh-my-pi's `contextWindow` in models.yml. Name no provider that the profile's
# `opencode_providers` defines.
[context_limits]
"provider-b/small-model" = 100000

# --- Where one frontend differs ------------------------------------------------------------------

# [opencode] and [omp] hold the same sub-tables as above. Each key replaces the shared one for that
# frontend alone; a key it does not name stays shared. Here oh-my-pi runs another small model, as
# when the shared one answers only OpenCode.
[omp.models]
small = "provider-d/small-model"
