# The Python environment of the harness. `bin/harness` makes it with `uv sync --locked --no-dev`
# at ~/.local/share/research-harness/python/ ($RESEARCH_HARNESS_PYTHON) and runs every command on
# its interpreter; `harness install --apply` syncs it again, with the `dev` group where the
# profile sets `develop = true`. The lock is uv.lock, committed beside this file. The harness
# itself needs no package beyond the standard library, so `dependencies` stays empty: a runtime
# dependency goes there with a one-line reason.

[project]
name = "research-harness"
version = "0"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "ruff==0.17.2",  # formats and lints the Python code, at one pinned version on every machine
    "basedpyright==1.40.2",  # checks the types of the Python code, at one pinned version on every machine
]

# The strict profile. `ruff format --check`, `ruff check` and `basedpyright` gate every commit
# (.githooks/pre-commit), every push to main (.githooks/pre-push) and CI. Besides the *.py files,
# ruff reads the two Python files without a suffix: bin/harness, whose syntax is the closed set of
# Python 3.0 forms that `environment.syntax_cases` checks, so the formatter and the UP family
# leave it alone, and the pre-commit hook.
[tool.ruff]
line-length = 110
target-version = "py314"
extend-include = ["bin/harness", ".githooks/pre-commit"]

[tool.ruff.format]
exclude = ["bin/harness"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "BLE", "TRY", "PTH", "S", "UP", "SIM", "RET", "C4", "PERF", "PL", "RUF", "ARG",
          "FBT", "DTZ", "N", "TID"]
# S603: every subprocess call here passes an argument list, never a shell. TRY003: an error names
# its cause in its message.
ignore = ["S603", "TRY003"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"os.system".msg = "runs a shell; use subprocess.run with an argument list"
"os.popen".msg = "runs a shell; use subprocess.run with an argument list"

# The profile's own ignores: a file that holds test cases (a `selftest`, a module of cases, the
# hook probe, the kit's tests) calls each `case(lambda: …)` at once (B023) and compares with
# literal values (PLR2004), and bin/harness keeps its Python 3.0 forms (UP).
[tool.ruff.lint.per-file-ignores]
"bin/harness" = ["UP"]
"lib/harness/{changelog,docs,doctor,dotfiles_kit,environment,frontmatter,install,install_cases,network,profile,protection,providers,repos,script_cases,skill_triggers,sweep,testrun,units,update}.py" = [
    "B023",
    "PLR2004",
]
"adapters/*/adapter.py" = ["B023", "PLR2004"]
"hooks/probe.py" = ["B023", "PLR2004"]
"examples/dotfiles/tests/*.py" = ["B023", "PLR2004"]

