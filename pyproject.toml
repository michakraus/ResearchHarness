# basedpyright reads only *.py files, so `bin` names no file today. `lib` is on the search path,
# as `bin/harness` puts it on `sys.path`. The errors of the code that strict mode met are in
# .basedpyright/baseline.json, which `basedpyright --writebaseline` writes; a module that a change
# touches leaves it.
[tool.basedpyright]
include = ["lib", "hooks", "adapters", "scripts", "bin"]
extraPaths = ["lib"]
typeCheckingMode = "strict"
pythonVersion = "3.14"
