name: test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The suite on the harness's Python environment, which uv makes from uv.lock. The job on the
  # latest 3.x only warns: its failure does not fail the run.
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.warn }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.14']
        warn: [false]
        include:
          - python-version: '3.x'
            warn: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      # The uv release that bin/harness pins (UV_VERSION).
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.5'
      # The environment at the path that bin/harness reads, on the matrix's Python, so that the 3.x
      # job tests the latest; then its stamp, as bin/harness's own `sync` writes it.
      - name: uv sync --locked
        run: |
          environment="$HOME/.local/share/research-harness/python"
          UV_PROJECT_ENVIRONMENT="$environment" UV_PYTHON="$(command -v python)" uv sync --locked --no-dev
          python -c '
          import sys
          boot = {"__name__": "harness_boot", "__file__": "bin/harness"}
          exec(compile(open("bin/harness").read(), "bin/harness", "exec"), boot)
          with open(sys.argv[1] + "/" + boot["STAMP"], "w") as f:
              f.write(boot["stamp_text"](False))
          ' "$environment"
          "$environment/bin/python" --version
      - name: harness test
        run: python bin/harness test
      - name: compileall
        run: '"$HOME/.local/share/research-harness/python/bin/python" -m compileall -q lib hooks scripts adapters'

  # The suite with HOME set to a new empty directory, so a case that needs a file of the runner's
  # home fails here.
  empty-home:
    name: harness test with an empty HOME
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: harness test
        run: |
          home="$RUNNER_TEMP/empty-home"
          mkdir "$home"
          HOME="$home" python bin/harness test

  # A pull request that changes code adds a fragment to changelog.d/; the check reads
  # `git diff BASE...HEAD`, so the checkout holds the whole history.
  changelog:
    name: changelog fragment
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: harness changelog --check
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: python3 bin/harness changelog --check "$BASE"

  # Each systemd --user unit, rendered with examples/profile.toml under this runner's home, where
  # stubs stand for the programs that the units start: systemd-analyze verify checks that each
  # ExecStart is executable.
  systemd:
    name: systemd-analyze verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: render each unit and verify it
        run: |
          for program in .julia/bin/kaimon .juliaup/bin/julia .local/bin/claude-autocommit; do
            mkdir -p "$HOME/$(dirname "$program")"
            printf '#!/bin/sh\nexit 0\n' > "$HOME/$program"
            chmod +x "$HOME/$program"
          done
          mkdir -p "$HOME/Research"
          units="$RUNNER_TEMP/units"
          mkdir "$units"
          for f in systemd/*; do
            python3 bin/harness --profile examples/profile.toml render "$f" > "$units/$(basename "$f")"
            echo "rendered $f"
          done
          systemd-analyze --version | head -n 1
          systemd-analyze verify --user "$units"/*
          # The canary: without the program that kaimon.service starts, verify must fail.
          rm "$HOME/.julia/bin/kaimon"
          if systemd-analyze verify --user "$units/kaimon.service"; then
            echo "canary: systemd-analyze verify passed a unit whose ExecStart does not exist"
            exit 1
          fi

  # The five tests of the dotfiles kit in examples/dotfiles/, with chezmoi from its release
  # tarball. The tests render the kit with their own --config, --source, --destination and
  # --persistent-state, and run the scripts in scratch homes under $TMPDIR. script-check.py
  # renders the units and plists with this checkout at its HEAD as harness_commit.
  dotfiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install chezmoi
        env:
          VERSION: 2.73.2
          SHA256: 4d7bd8072f15373d5f5c801209bac218527452c8e54f9ae46ba6c5bd4a6eca41
        run: |
          curl -sSfL -o "$RUNNER_TEMP/chezmoi.tar.gz" \
            "https://github.com/twpayne/chezmoi/releases/download/v${VERSION}/chezmoi_${VERSION}_linux_amd64.tar.gz"
          echo "${SHA256}  $RUNNER_TEMP/chezmoi.tar.gz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/chezmoi.tar.gz" -C "$RUNNER_TEMP/bin" chezmoi
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # Diagnostic: the cat of the runner and its exit status on a broken pipe (141 for GNU cat).
      - name: cat on a broken pipe
        shell: bash
        run: |
          cat --version | head -n 1
          set +e
          head -c 200000 /dev/zero | cat | head -c 1 >/dev/null
          echo "cat status ${PIPESTATUS[1]}"
      - name: the kit's tests
        run: |
          chezmoi --version
          python3 --version
          python3 examples/dotfiles/tests/update-check.py
          python3 examples/dotfiles/tests/check-check.py
          python3 examples/dotfiles/tests/driver-check.py
          python3 examples/dotfiles/tests/render-check.py
          python3 examples/dotfiles/tests/script-check.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck over every tracked file with a sh or bash shebang
        run: |
          files=()
          while IFS= read -r f; do
            if head -n 1 "$f" | grep -qE '^#!(/usr)?/bin/(env )?(ba)?sh'; then
              files+=("$f")
            fi
          done < <(git ls-files)
          echo "${files[@]}"
          shellcheck -S warning "${files[@]}"
      - name: actionlint over .github/workflows/
        env:
          VERSION: 1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl -sSfL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_linux_amd64.tar.gz"
          echo "${SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint .github/workflows/*.yml

  # gitleaks with .gitleaks.toml over the pushed range, the checkout and the dummy render; every
  # call passes GITLEAKS_FLAGS, with --redact, because the logs become public, and
  # --ignore-gitleaks-allow, so the canary checks the flags of every scan. CI has no profile: the
  # private strings are the pre-push hook's `harness leaks`.
  leaks:
    runs-on: ubuntu-latest
    env:
      # A .pyc holds its source's path, a home path on the runner.
      PYTHONDONTWRITEBYTECODE: '1'
      GITLEAKS_FLAGS: --config .gitleaks.toml --redact --ignore-gitleaks-allow --no-banner --no-color --verbose
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: install gitleaks
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: canary, a synthetic token and home path are found and the token is redacted
        run: |
          canary="$RUNNER_TEMP/canary"
          mkdir "$canary"
          token=ghp_$(python3 -c 'import secrets, string; print("".join(secrets.choice(string.ascii_letters + string.digits) for _ in range(36)))')
          echo "token = \"$token\"" > "$canary/token.txt"
          # Built at run time, so that this file holds no home path.
          users=/Users
          echo "path = $users/probe-user/x" > "$canary/home.txt"
          status=0
          read -ra flags <<< "$GITLEAKS_FLAGS"
          gitleaks dir "${flags[@]}" --report-format json --report-path "$RUNNER_TEMP/canary.json" "$canary" > "$RUNNER_TEMP/canary.log" 2>&1 || status=$?
          cat "$RUNNER_TEMP/canary.log"
          if [ "$status" -ne 1 ]; then
            echo "canary: gitleaks exited $status, not 1"
            exit 1
          fi
          python3 - "$RUNNER_TEMP/canary.json" <<'EOF'
          import json, sys
          files = {f["File"].rsplit("/", 1)[-1]: f["RuleID"] for f in json.load(open(sys.argv[1]))}
          print("canary findings:", files)
          sys.exit(not (files.get("home.txt") == "home-path" and "token.txt" in files))
          EOF
          if grep -qF "$token" "$RUNNER_TEMP/canary.log"; then
            echo "canary: the token is in the log, not redacted"
            exit 1
          fi
      - name: gitleaks over the pushed range
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # A push: before..sha. When before is all zeros, absent or not in the clone (a forced
          # push), origin/main..HEAD for a branch and the whole history for main.
          if [ "$EVENT" = pull_request ]; then
            range="$BASE..$HEAD"
          elif [ -n "${BEFORE//0/}" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..$GITHUB_SHA"
          elif [ "$REF" = refs/heads/main ]; then
            range="$GITHUB_SHA"
          else
            range="origin/main..$GITHUB_SHA"
          fi
          echo "range: $range"
          read -ra flags <<< "$GITLEAKS_FLAGS"
          gitleaks git "${flags[@]}" --log-opts="$range" .
          # gitleaks git reads no commit message; pipefail, so a failed git log fails the step.
          set -o pipefail
          git log --format=%B "$range" | gitleaks stdin "${flags[@]}"
      - name: gitleaks over the checkout
        run: |
          read -ra flags <<< "$GITLEAKS_FLAGS"
          gitleaks dir "${flags[@]}" .
      - name: gitleaks over the templates rendered with examples/profile.toml
        run: |
          render="$RUNNER_TEMP/render"
          python3 -c 'import sys; sys.path.insert(0, "lib"); from harness import profile; print(*profile.templates(), sep="\n")' > "$RUNNER_TEMP/templates"
          while IFS= read -r t; do
            mkdir -p "$(dirname "$render/$t")"
            python3 bin/harness --profile examples/profile.toml render "$t" > "$render/$t"
            echo "rendered $t"
          done < "$RUNNER_TEMP/templates"
          read -ra flags <<< "$GITLEAKS_FLAGS"
          gitleaks dir "${flags[@]}" "$render"

  # The strict profile of the Python code, with the ruff and basedpyright of the dev group of
  # uv.lock: an environment that uv syncs with that group, whose bin/ comes first on the PATH.
  strict:
    name: ruff and basedpyright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.5'
      - name: uv sync --locked, with the dev group
        run: |
          UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/env" UV_PYTHON="$(command -v python)" uv sync --locked
          echo "$RUNNER_TEMP/env/bin" >> "$GITHUB_PATH"
      - name: ruff format --check
        run: ruff format --check --no-cache .
      - name: ruff check
        run: ruff check --no-cache .
      - name: basedpyright
        run: basedpyright
