name: docs

# Builds the documentation site with docs/make.jl. A pull request checks that the site builds,
# with Documenter's checks of the local links; a push to main also deploys it to gh-pages. The
# build draws the figures from docs/figures/, agents/, skills/ and examples/models.toml, and the
# job fails when a committed figure differs from the one the build draws.
on:
  push:
    branches: [main]
    paths: ['README.md', 'docs/**', 'agents/**', 'skills/**', 'examples/models.toml', '.github/workflows/docs.yml']
  pull_request:
    paths: ['README.md', 'docs/**', 'agents/**', 'skills/**', 'examples/models.toml', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    permissions:
      # deploydocs pushes the built site to gh-pages.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3.0.2
        with:
          version: '1.13'
      - name: Instantiate docs/Project.toml
        run: julia --startup-file=no --project=docs -e 'using Pkg; Pkg.instantiate()'
      - name: Build and deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: julia --startup-file=no --project=docs docs/make.jl
      - name: The committed figures are the ones the build draws
        run: git diff --exit-code docs/src/assets/figures
