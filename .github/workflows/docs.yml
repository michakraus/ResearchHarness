name: docs

# Builds the documentation site with VitePress, from docs/. A pull request checks that the site
# builds, with VitePress's check of the local links, and that every page of the menu is in the
# sidebar; a push to main also deploys it to gh-pages. The build draws the call graphs from
# docs/figures/calls.toml, agents/, skills/ and examples/models.toml.
on:
  push:
    branches: [main]
    paths: ['docs/**', 'agents/**', 'skills/**', 'examples/models.toml', '.github/workflows/docs.yml']
  pull_request:
    paths: ['docs/**', 'agents/**', 'skills/**', 'examples/models.toml', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    permissions:
      # The deploy step pushes the built site to gh-pages.
      contents: write
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Install the packages of docs/package-lock.json
        run: npm ci
      - name: Build
        run: npm run docs:build
      - name: Every page of the menu is in the sidebar
        run: npm run docs:check
      # The site is one version at the root of gh-pages. `.nojekyll` makes GitHub Pages serve the
      # files whose names start with `_`.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          ref: gh-pages
          path: gh-pages
      - name: Deploy to gh-pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        working-directory: gh-pages
        run: |
          git rm -rq --ignore-unmatch .
          cp -R ../docs/build/. .
          touch .nojekyll
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -qm "Deploy the site of $GITHUB_SHA"
          git push origin gh-pages
